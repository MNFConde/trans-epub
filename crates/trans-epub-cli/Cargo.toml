[package]
name = "trans-epub-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
indicatif = "0.18"
serde_json = "1"
toml = "1"
trans-epub-core = { path = "../trans-epub-core" }
walkdir = "2"
# TLS 用 native-tls（Windows=schannel，免 CMake/NASM）；默认 feature 的
# rustls/aws-lc-rs 在 Windows 构建负担重
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "native-tls",
    "charset",
    "system-proxy",
] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "trans-epub"
path = "src/main.rs"
