[package]
name = "trans-epub-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
indicatif = "0.18"
serde_json = "1"
toml = "1"
trans-epub-core = { path = "../trans-epub-core" }
# PoliteFetcher 自这里来（reqwest/native-tls 的选择在 fetch crate 统一）
trans-epub-fetch = { path = "../trans-epub-fetch" }
walkdir = "2"
url = "2.5.8"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "trans-epub"
path = "src/main.rs"
